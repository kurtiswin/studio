<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kurtis Win · Telling beautiful stories</title>
<meta name="description" content="Telling beautiful stories. Java Bonito, Woolton FC and Stories from Football, plus behind the scenes of what I'm building.">
<meta name="theme-color" content="#000000">
<meta property="og:title" content="Kurtis Win · Telling beautiful stories">
<meta property="og:description" content="Telling beautiful stories. See behind the scenes of what I'm building.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://link.kurtiswin.com/">
<meta property="og:image" content="https://link.kurtiswin.com/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://link.kurtiswin.com/og.jpg">
<link rel="canonical" href="https://link.kurtiswin.com/">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Instrument+Serif:ital@1&display=swap">
<style>
:root{--bg:#000;--text:#fff;--muted:#b8b8b8;--gold:#FFC65C;--line:rgba(255,255,255,.12);
  --sans:"Poppins",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--serif:"Instrument Serif",Georgia,serif;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#000}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);line-height:1.5;overflow-x:clip;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:8px}
.wrap{max-width:480px;margin:0 auto;padding-block:calc(64px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;text-align:center}
@media(min-width:700px){.wrap{padding-top:clamp(80px,12vh,140px)}}

.home{display:block;width:min(300px,82%)}
.wordmark{display:block;width:100%;height:auto}
.tag{margin:10px 0 0;font-size:min(.95rem,3.9vw);white-space:nowrap;font-weight:400;letter-spacing:-.035em;line-height:1.1}
@media(min-width:1000px){.tag{font-size:clamp(.95rem,1.5vw,1.15rem)}}
.tag em{font-family:var(--serif);font-weight:400;font-style:italic;letter-spacing:-.01em;color:var(--gold);font-size:1.12em;line-height:.9}

.label{margin:0;font-size:15px;font-weight:400;letter-spacing:.02em;text-transform:none;color:var(--text);text-align:left}
svg.i{width:20px;height:20px;flex:none;color:var(--gold)}
.signup{width:100%;margin-top:40px}
.signup .label{margin-bottom:14px}
form{display:flex;gap:10px}
input{flex:1 1 0;min-width:0;height:56px;border-radius:16px;border:1px solid var(--line);background:#000;color:var(--text);padding:0 14px 0 16px;font:inherit;font-size:16px}
input::placeholder{color:#fff;opacity:1}
input:focus{outline:none;border-color:transparent;box-shadow:0 0 0 2px var(--gold)}
button{height:56px;padding:0 16px 0 18px;border-radius:16px;border:0;background:#000;color:#fff;font:inherit;font-size:16px;font-weight:600;cursor:pointer;flex:0 0 auto;
  display:inline-flex;align-items:center;gap:8px;box-shadow:0 0 0 1px var(--line);transition:box-shadow .25s ease,transform .25s cubic-bezier(.2,.7,.2,1)}
button .arr{display:inline-block;transition:transform .25s cubic-bezier(.2,.7,.2,1)}
button:hover{box-shadow:0 0 0 2px var(--gold);transform:translateY(-2px)}
button:hover .arr{transform:translateX(4px)}
button:active{transform:none}
/* single-box email field: arrow lives inside */
form{position:relative;display:block}
input{width:100%;height:56px;border-radius:20px;padding:0 64px 0 20px;font-weight:600}
input::placeholder{color:#fff;opacity:1;font-weight:600}
form button{position:absolute;right:6px;top:6px;width:44px;height:44px;padding:0;border-radius:14px;background:transparent;box-shadow:none;color:var(--gold);justify-content:center}
form button:hover{box-shadow:none;transform:none;color:var(--gold)}
form button:hover .arr{transform:translateX(3px)}
form button .arr{display:inline-flex}
.msg{margin:14px 0 0;font-size:14px;min-height:1.4em;text-align:center;color:var(--gold)}
.msg.err{color:#ff9d8a}

.pills{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:36px}
.pill{display:inline-flex;align-items:center;gap:9px;min-height:44px;padding:0 18px 0 14px;border-radius:999px;background:#000;box-shadow:0 0 0 1px var(--line);font-size:15px;font-weight:500;transition:box-shadow .25s ease}
.pill:hover{box-shadow:0 0 0 2px var(--gold)}

.building{margin-top:6px;width:100%}
.building .label{margin-bottom:14px}
.rows{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:14px;padding:12px 18px 12px 12px;border-radius:24px;background:#000;box-shadow:0 0 0 1px var(--line);text-align:left;transition:box-shadow .25s ease}
a.row:hover,a.row:focus-visible{box-shadow:0 0 0 2px var(--gold)}
.row img{width:52px;height:52px;border-radius:14px;object-fit:cover;box-shadow:0 0 0 1px var(--line);flex:none;transition:transform .45s cubic-bezier(.34,1.56,.64,1)}
.row img.badge{object-fit:contain;padding:6px;background:#000}
a.row:hover img{transform:scale(1.12) rotate(-6deg)}
.row .t{flex:1;min-width:0}
.row b{display:block;font-size:16px;font-weight:500}
.row small{display:block;margin-top:2px;font-size:13px;font-weight:300;color:var(--muted)}
.row .go{color:var(--gold);font-size:18px;transition:transform .25s cubic-bezier(.2,.7,.2,1)}
a.row:hover .go{transform:translateX(4px)}

footer{margin-top:40px;font-size:14px;color:#8f8f8f}

.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.d1{animation-delay:.06s}.d2{animation-delay:.16s}.d3{animation-delay:.26s}.d4{animation-delay:.36s}.d5{animation-delay:.46s}
@keyframes rise{from{opacity:.001;transform:translateY(18px)}}
@media(prefers-reduced-motion:reduce){.rise{animation:none}button,button .arr,.row img,.row .go{transition:none}button:hover,.row:hover img,.row:hover .go,button:hover .arr{transform:none}}
</style>
</head>
<body>
<main class="wrap">
  <a class="home rise d1" href="https://www.kurtiswin.com" aria-label="KurtisWin: go to kurtiswin.com"><img class="wordmark" src="logo-kurtiswin.png" alt="KurtisWin" width="720" height="160"></a>
  <p class="tag rise d2">Telling <em>beautiful</em> stories.</p>

  <section class="signup rise d3" aria-labelledby="sh">
    <h2 class="label" id="sh">See behind the scenes:</h2>
    <form id="f" novalidate>
      <input id="email" name="email_address" type="email" inputmode="email" autocomplete="email" aria-label="Email address" placeholder="Email" required>
      <button type="submit" aria-label="Sign up"><span class="arr"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg></span></button>
    </form>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </section>

  <section class="building rise d4" aria-labelledby="bh">
    <h2 class="label" id="bh">What I'm building:</h2>
    <div class="rows">
      <a class="row" href="https://www.javabonito.co.uk" target="_blank" rel="noopener"><img src="icon-jb.png" alt=""><span class="t"><b>Java Bonito</b><small>Coffee for football</small></span><span class="go" aria-hidden="true">&rarr;</span></a>
      <a class="row" href="https://www.wooltonfc.co.uk" target="_blank" rel="noopener"><img class="badge" src="icon-wfc.png" alt=""><span class="t"><b>Woolton FC</b><small>The biggest grassroots football club in the UK</small></span><span class="go" aria-hidden="true">&rarr;</span></a>
      <div class="row"><img src="tile-sff.png" alt=""><span class="t"><b>Stories from Football</b><small>What made you fall in love with football?</small></span><span class="go" aria-hidden="true">&rarr;</span></div>
    </div>
  </section>


</main>
<script>
/* Email sign-up: sends the email to Kit form 10152446. To use a different form, change the number below. */
(function(){
  var KIT_FORM_ID='10152446';
  var f=document.getElementById('f'),e=document.getElementById('email'),m=document.getElementById('msg'),btn=f.querySelector('button');
  f.addEventListener('submit',function(ev){
    ev.preventDefault();
    var v=e.value.trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)){m.className='msg err';m.textContent='That email doesn’t look right. Try again?';e.focus();return;}
    btn.disabled=true;
    var done=function(){m.className='msg';m.textContent='You’re in. Check your inbox to confirm.';};
    fetch('https://app.kit.com/forms/'+KIT_FORM_ID+'/subscriptions',{method:'POST',mode:'no-cors',body:new FormData(f)}).then(done,done);
  });
})();
</script>
</body>
</html>
